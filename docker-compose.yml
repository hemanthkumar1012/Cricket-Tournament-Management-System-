version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: cricket_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
      MYSQL_DATABASE: cricket_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: cricket_backend
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/cricket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-root}
      - PORT=10000
    ports:
      - "10000:10000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: cricket_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:

