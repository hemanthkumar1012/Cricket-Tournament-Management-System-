services:
  db:
    image: postgres:16-alpine
    container_name: cricpulse_db
    environment:
      POSTGRES_DB: cricpulse
      POSTGRES_USER: cricpulse
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cricpulse-local}
    ports:
      - "5432:5432"
    volumes:
      - cricpulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricpulse -d cricpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./python-backend
    container_name: cricpulse_api
    environment:
      DATABASE_URL: postgresql+psycopg://cricpulse:${DATABASE_PASSWORD:-cricpulse-local}@db:5432/cricpulse
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      ENVIRONMENT: development
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: cricpulse_web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cricpulse_data:
